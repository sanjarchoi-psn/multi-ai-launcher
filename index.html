<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="icon-192.png">
<title>멀티 AI 프롬프터</title>
<style>
:root{--bg:#f3f5f2;--fg:#1b2420;--mut:#5d6b64;--card:#fff;--line:#d3dbd6;--ac:#1f6f5c;--acfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e8efeb;--mut:#93a39a;--card:#1a2420;--line:#2d3b35;--ac:#4cc0a0;--acfg:#06201a}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e8efeb;--mut:#93a39a;--card:#1a2420;--line:#2d3b35;--ac:#4cc0a0;--acfg:#06201a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Pretendard","Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 20px;color:var(--mut)}
textarea{width:100%;min-height:170px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
textarea:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
label.chip{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
label.chip input{accent-color:var(--ac);width:18px;height:18px}
a.btn{font:inherit;color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:11px 16px;background:var(--card);white-space:nowrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:11px 16px}
button.main{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600;width:100%;padding:14px}
.list{display:grid;gap:8px;margin-top:20px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.item small{display:block;color:var(--mut)}
.note{margin-top:16px;color:var(--mut);font-size:.9rem}
#msg{min-height:1.5em;margin-top:10px;color:var(--ac);font-weight:600}
</style>
</head>
<body>
<main>
<h1>멀티 AI 프롬프터</h1>
<p class="sub">프롬프트를 한 번 쓰고, 원하는 AI에 동시에 보내세요.</p>

<textarea id="p" placeholder="여기에 프롬프트를 입력하세요" aria-label="프롬프트"></textarea>

<div class="row" id="chips"></div>

<label class="chip" style="display:inline-flex;margin-bottom:12px"><input type="checkbox" id="appmode" checked> 앱으로 열기 (설치된 앱 우선)</label>
<button class="main" id="go">복사하고 선택한 AI 모두 열기</button>
<button class="main" id="next" style="display:none;margin-top:10px"></button>
<div id="msg" role="status"></div>

<div class="list" id="list"></div>

<p class="note">브라우저가 팝업을 차단하면 첫 창만 열릴 수 있어요. 이때는 아래 개별 버튼을 쓰거나 팝업을 허용하세요. 앱으로 열기는 휴대폰에 앱이 설치되어 있어야 하고, 기기·브라우저 설정에 따라 앱 대신 웹으로 열릴 수 있어요.</p>
</main>

<script>
function intent(u,pkg){var m=u.match(/^https:\/\/([^\/]+)(\/.*)$/);return "intent://"+m[1]+m[2]+"#Intent;scheme=https;action=android.intent.action.VIEW;package="+pkg+";S.browser_fallback_url="+encodeURIComponent(u)+";end"}
var AIS=[
 {id:"chatgpt",name:"ChatGPT",url:function(q){return "https://chatgpt.com/?q="+q},app:function(q){return intent("https://chatgpt.com/?q="+q,"com.openai.chatgpt")},auto:true},
 {id:"claude",name:"Claude",url:function(q){return "https://claude.ai/new?q="+q},app:function(q){return intent("https://claude.ai/new?q="+q,"com.anthropic.claude")},auto:true},
 {id:"perplexity",name:"Perplexity",url:function(q){return "https://www.perplexity.ai/search?q="+q},app:function(q){return intent("https://www.perplexity.ai/search?q="+q,"ai.perplexity.app.android")},auto:true},
 {id:"gemini",name:"Gemini",url:function(q){return "https://gemini.google.com/app?q="+q},auto:true},
 {id:"grok",name:"Grok",url:function(q){return "https://grok.com/?q="+q},app:function(q){return intent("https://grok.com/?q="+q,"ai.x.grok")},auto:true},
 {id:"copilot",name:"Copilot",url:function(q){return "https://copilot.microsoft.com/?q="+q},app:function(q){return "intent://chat?q="+q+"#Intent;scheme=ms-copilot;package=com.microsoft.office.officehubrow;S.browser_fallback_url="+encodeURIComponent("https://copilot.microsoft.com/?q="+q)+";end"},auto:true}
];
var p=document.getElementById("p"),msg=document.getElementById("msg");
var chips=document.getElementById("chips"),list=document.getElementById("list");

function load(){try{return JSON.parse(localStorage.getItem("mp")||"null")}catch(e){return null}}
function save(){try{localStorage.setItem("mp",JSON.stringify({t:p.value,s:selected()}))}catch(e){}}
function selected(){return AIS.filter(function(a){return document.getElementById("c-"+a.id).checked}).map(function(a){return a.id})}

AIS.forEach(function(a){
 var l=document.createElement("label");l.className="chip";
 l.innerHTML='<input type="checkbox" id="c-'+a.id+'" checked> '+a.name;
 chips.appendChild(l);
 var d=document.createElement("div");d.className="item";
 d.innerHTML='<div>'+a.name+'<small>'+(a.auto?'프롬프트 자동 입력':'프롬프트 자동 입력')+'</small></div>';
 var b=document.createElement("a");b.textContent=a.name+" 열기";b.className="btn";b.id="a-"+a.id;
 b.target="_blank";b.rel="noopener";b.href=a.url("");
 b.addEventListener("click",function(){var t=p.value.trim();if(!t){msg.textContent="프롬프트를 먼저 입력하세요.";return}copy(t);msg.textContent=a.name+" 열기 (프롬프트 복사됨)"});
 d.appendChild(b);list.appendChild(d);
});

var st=load();
if(st){p.value=st.t||"";AIS.forEach(function(a){document.getElementById("c-"+a.id).checked=!st.s||st.s.indexOf(a.id)>-1})}
p.addEventListener("input",save);
chips.addEventListener("change",save);

function target(a,q){return (document.getElementById("appmode").checked&&a.app)?a.app(q):a.url(q)}
function appOn(a){return document.getElementById("appmode").checked&&!!a.app}
function refresh(){var q=encodeURIComponent(p.value.trim());AIS.forEach(function(a){var e=document.getElementById("a-"+a.id);e.href=target(a,q);e.target=appOn(a)?"_self":"_blank"})}
document.getElementById("appmode").addEventListener("change",refresh);
p.addEventListener("input",refresh);refresh();
function copy(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true},function(){return fb(t)})}}catch(e){}
 return Promise.resolve(fb(t));
}
function fb(t){try{var x=document.createElement("textarea");x.value=t;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();var ok=document.execCommand("copy");document.body.removeChild(x);return ok}catch(e){return false}}
var queue=[];
function go(a,q){
 var l=document.createElement("a");l.href=target(a,q);l.target=appOn(a)?"_self":"_blank";l.rel="noopener";l.style.display="none";
 document.body.appendChild(l);l.click();document.body.removeChild(l);
}
function updNext(){
 var n=document.getElementById("next");
 if(queue.length){n.style.display="block";n.textContent="다음: "+queue[0].name+" 열기 (남은 "+queue.length+"개)"}else{n.style.display="none"}
}
function nextApp(){
 var t=p.value.trim();if(!queue.length)return;
 var a=queue.shift(),q=encodeURIComponent(t);
 fb(t);copy(t);updNext();go(a,q);
 msg.textContent=a.name+" 실행"+(a.id==="gemini"?" (입력창에 붙여넣기)":"")+(queue.length?". 돌아오면 아래 '다음' 버튼을 누르세요.":". 프롬프트도 복사됨.");
}
document.getElementById("next").onclick=nextApp;
function send(targets){
 var t=p.value.trim();
 if(!t){msg.textContent="프롬프트를 먼저 입력하세요.";p.focus();return}
 if(!targets.length){msg.textContent="AI를 하나 이상 선택하세요.";return}
 if(document.getElementById("appmode").checked){queue=targets.slice();nextApp();return}
 fb(t);copy(t);
 var q=encodeURIComponent(t);
 targets.forEach(function(a){go(a,q)});
 msg.textContent=targets.length+"개 AI 실행. 프롬프트도 복사됨. 입력창이 비어 있으면 붙여넣기 하세요.";
}
document.getElementById("go").onclick=function(){
 var ids=selected();send(AIS.filter(function(a){return ids.indexOf(a.id)>-1}));
};
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
